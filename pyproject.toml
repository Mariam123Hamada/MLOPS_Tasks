[project]
name = "prodml"
version = "0.1.0"
description = "Production ML project for NYC taxi trip duration prediction"
requires-python = ">=3.10"

dependencies = [
    "scikit-learn",
    "boto3",
    "psycopg2-binary",
    "pandas",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "python-json-logger",
    "numpy",
    "onnx",
    "onnxruntime",
    "skl2onnx",
    "mlflow",
    "xgboost",
    "torch",
    "matplotlib",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "httpx",
    "pre-commit"
]

[project.scripts]
prodml-train = "prodml.train:main"
prodml-export = "prodml.export:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
addopts = "--cov=src/prodml --cov-fail-under=70"
