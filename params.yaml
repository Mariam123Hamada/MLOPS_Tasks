# DVC Pipeline Parameters
prepare:
  train_test_split: 0.8
  validation_split: 0.2
  random_state: 42

featurize:
  min_trip_duration: 0
  max_trip_duration: 200
  # Feature engineering parameters
  random_state: 42

train:
  model_type: linear_regression
  fit_intercept: true
  random_state: 42

evaluate:
  # Evaluation thresholds
  min_r2_score: 0.5
  max_rmse: 15.0
