name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ============================================================
  # LINT
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.12.0 black==25.1.0

      - name: Run Ruff
        run: ruff check .

      - name: Check Black formatting
        run: black --check .


  # ============================================================
  # TEST
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
  
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
  
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
  
      - name: Start MLflow
        run: |
          docker compose -f docker/docker-compose.yml up -d postgres minio create-minio-bucket mlflow
  
      - name: Wait for MLflow
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:5000/health; then
              echo "MLflow is ready"
              exit 0
            fi
  
            echo "Waiting for MLflow..."
            sleep 2
          done
  
          echo "MLflow failed to start"
          docker compose -f docker/docker-compose.yml logs mlflow
          exit 1
  
      - name: Run tests with coverage
        run: |
          pytest --cov --cov-fail-under=50
  
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            .coverage
            coverage.xml
            htmlcov/

  # ============================================================
  # BUILD AND PUSH DOCKER IMAGE
  # ============================================================
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract short commit SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-tasks:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-tasks:sha-${{ steps.vars.outputs.short_sha }}
  quality-gate:
    name: Model Quality Gate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run DVC pipeline
        run: |
          dvc repro

      - name: Check model quality
        env:
          PRODUCTION_MAE: ${{ secrets.PRODUCTION_MAE }}
        run: |
          python scripts/model_quality_gate.py "$c"
